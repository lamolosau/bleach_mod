plugins {
  id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

repositories {
  maven {
    name = "GeckoLib"
      url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
  }
  maven {
    name = "Ladysnake Libs"
      url = 'https://maven.ladysnake.org/releases'
  }
  maven {
    url = 'https://maven.cafeteria.dev'
      content {
        includeGroup 'net.adriantodt.fabricmc'
      }
  }
  maven {
    url "https://maven.jamieswhiteshirt.com/libs-release"
      content {
        includeGroup "com.jamieswhiteshirt"
      }
  }
  maven {
    name = "Modrinth"
      url = "https://api.modrinth.com/maven"
      content {
        includeGroup "maven.modrinth"
      }
  }
  maven {
    url "https://jitpack.io"
  }
  maven {
    url "https://maven.shedaniel.me/"
  }
  maven {
    url "https://maven.terraformersmc.com/"
  }
}

loom {
  splitEnvironmentSourceSets()

    mods {
      "modid" {
        sourceSet sourceSets.main
          sourceSet sourceSets.client
      }
    }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.github.apace100:origins-fabric:${project.origins_version}"
    modCompileOnly "com.github.apace100:apoli:v2.9.0"
    modCompileOnly "com.github.apace100:calio:v1.11.0"
    modCompileOnly "maven.modrinth:cardinal-components-api:5.2.1" 
}

processResources {
  def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
      expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 17
}

java {
  // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
  // if it is present.
  // If you remove this line, sources will not be generated.
  withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
  def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
      rename { "${it}_$projectName"}
    }
}

// configure the maven publication
publishing {
  publications {
    create("mavenJava", MavenPublication) {
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}
